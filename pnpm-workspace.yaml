# pnpm v11 configuration for the root app.
#
# In pnpm 11, settings are NO LONGER read from the `pnpm` field in package.json,
# and only auth/registry settings are read from .npmrc. Everything else lives here.
# A setting left in package.json is ignored SILENTLY, with no warning — see
# https://github.com/pnpm/pnpm/issues/11536
#
# `packages:` is deliberately omitted. With no `packages` field only the root
# package is in the workspace, which keeps `studio/` an independent install with
# its own lockfile — matching how this repo has always been structured.

# Was `overrides` in package.json under npm. pnpm 11 does not read that field.
# Required so @svgr/rollup's @babel/preset-env and @vitejs/plugin-react's optional
# @rolldown/plugin-babel peer resolve to a single @babel/core. Removing this
# reintroduces the ERESOLVE conflict documented in the react-vite-major-upgrade skill.
overrides:
  '@babel/core': ^7.29.0
  # Parents pin ranges that stop short of the patched release, so
  # `pnpm audit --audit-level high` stays red until these are forced.
  # basic-ftp is the one major bump: get-uri asks for ^5, and 5.x has no fix.
  adm-zip: ^0.6.1
  axios: ^1.20.0
  basic-ftp: ^6.2.1
  'brace-expansion@1': ^1.1.20
  'brace-expansion@2': ^2.1.6
  compression: ^1.8.2
  fast-uri: ^3.1.7
  follow-redirects: ^1.16.1
  js-yaml: ^4.3.2
  source-map-js: ^1.2.2
  svgo: ^3.3.5
  # @axe-core/cli depends on chromedriver "latest". Keep the driver this
  # repo already ran in CI instead of floating it on a lockfile refresh.
  chromedriver: 151.0.5

# braces >=3.0.4 is the release named by this advisory, and npm has never
# published it (latest is 3.0.3). The finding is a stack overflow in
# Tailwind's dev-time file watcher, not in the shipped site.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

# Dependency install scripts are blocked by default in pnpm 11 and `strictDepBuilds`
# now defaults to true, so an unlisted package that wants to build fails the install
# with ERR_PNPM_IGNORED_BUILDS rather than warning. Add packages here as that error
# names them — do not disable the check.
#
# This list came from the orphaned `allowScripts` block that used to sit in
# package.json. That was @lavamoat/allow-scripts syntax with lavamoat never
# installed, so it enforced nothing. These entries are now actually load-bearing.
allowBuilds:
  esbuild: true
  fsevents: true
  '@vercel/speed-insights': true
  chromedriver: true

# Enforce package.json's `engines.node` floor instead of warning past it. The floor
# is >=22.13.0: vite/rolldown/@vitejs/plugin-react need >=22.12.0, and pnpm 11.21
# needs >=22.13. Without this, `engines` is documentation that nothing checks.
# .nvmrc, CI (`node-version-file`), and Docker (`FROM node:<nvmrc>-alpine`) share
# one pin so a 22.x below the floor cannot reach `pnpm install`.
engineStrict: true
# Note on minimumReleaseAge: pnpm 11 defaults it to 1440 minutes (24h), which blocks
# freshly published versions and is a real defense against the npm worm campaigns —
# see the npm-supply-chain-triage skill. It is deliberately NOT set explicitly here:
# setting it flips `minimumReleaseAgeStrict` to true, which makes resolution *fail*
# instead of falling back when nothing in range is old enough. The default gives the
# protection without the brittleness.
