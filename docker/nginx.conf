# Static serving config for the production image.
#
# Listens on 3000 to match the documented `docker run -p 3000:3000`. The base
# image is nginx-unprivileged, which runs as UID 101 — 3000 is above 1024, so no
# root is needed to bind it.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. React Router's BrowserRouter owns /careers-hub, /connections,
    # /media, /past-events, /past-events/:year, /previous-events,
    # /previous-events/:year and the * NotFound route. Without try_files, nginx
    # looks for a matching file on disk and 404s on every direct request and page
    # refresh. This is the nginx equivalent of the rewrite in vercel.json.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames into /assets, so they are safe to cache
    # forever. index.html must NOT be cached, or a browser keeps loading the old
    # entry point — and therefore old asset hashes — after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
