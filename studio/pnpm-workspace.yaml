# pnpm v11 configuration for the Sanity Studio subproject.
#
# This file exists to mark `studio/` as its own workspace root so pnpm does not
# walk up and attach it to the root app's workspace. Studio stays an independent
# install with its own lockfile and node_modules, exactly as it was under npm.
#
# Run pnpm commands for the Studio from inside this directory (or via the root's
# `pnpm run studio:dev`).

# Dependency install scripts are blocked by default in pnpm 11. Add entries here as
# ERR_PNPM_IGNORED_BUILDS names them during `pnpm install`.
allowBuilds:
  esbuild: true
  fsevents: true
minimumReleaseAgeExclude:
  - '@sanity/access-ui@6.10.0 || 6.10.1'
  - '@sanity/cli-build@5.2.1'
  - '@sanity/cli-core@3.1.0'
  - '@sanity/cli@8.0.2'
  - '@sanity/client@8.1.0'
  - '@sanity/diff@6.10.0 || 6.10.1'
  - '@sanity/mutator@6.10.0 || 6.10.1'
  - '@sanity/schema@6.10.0 || 6.10.1'
  - '@sanity/types@6.10.0 || 6.10.1'
  - '@sanity/util@6.10.0 || 6.10.1'
  - '@sanity/vision@6.10.0 || 6.10.1'
  - '@sanity/workbench-cli@2.0.1'
  - '@sanity/workbench@0.1.0-alpha.42'
  - get-it@9.5.0
  - sanity@6.10.0 || 6.10.1
