name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# pnpm/action-setup must run BEFORE actions/setup-node: setup-node's `cache: 'pnpm'`
# needs the pnpm binary on PATH to resolve the store path. No `version:` input is
# given — action-setup reads the `packageManager` field from package.json, so the
# pinned version lives in exactly one place.
#
# Note on `pnpm install --frozen-lockfile`: pnpm 11 sets `minimumReleaseAge` to 1440
# minutes by default and `trustLockfile` to false, so CI re-verifies every locked
# entry against that age on each install. A dependency bumped to a version published
# less than 24h ago will fail here even though the lockfile is frozen. That is the
# supply-chain guard doing its job — wait it out rather than setting trustLockfile.

jobs:
  quality-and-build:
    name: Code Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Prettier formatting
        run: pnpm run format:check

      - name: Build application
        run: |
          timeout 300 pnpm run build || {
            echo "Build failed or timed out after 5 minutes"
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 1

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: quality-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Install ChromeDriver matching installed Chrome
        uses: nanasess/setup-chromedriver@v2

      # `pnpm exec` rather than ./node_modules/.bin/ — under pnpm's symlinked layout
      # the .bin directory is still populated for direct dependencies, but pnpm exec
      # resolves correctly regardless of hoisting and is the supported entry point.
      - name: Start local server
        run: |
          pnpm exec serve dist -s -l 3000 &
          sleep 5

      - name: Run accessibility tests
        run: |
          timeout 60 pnpm exec axe http://localhost:3000 \
            --chromedriver-path "$(which chromedriver)" \
            --exit || {
            echo "Accessibility tests failed or timed out"
            exit 1
          }

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Moderate vulnerabilities in dev dependencies are acceptable for a static
      # site; high and critical fail the build.
      - name: Run security audit
        run: pnpm audit --audit-level high
